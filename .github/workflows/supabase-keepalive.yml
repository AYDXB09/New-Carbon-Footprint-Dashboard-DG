name: Keep Supabase awake

# Supabase's free tier pauses a project after ~7 days with no API activity —
# that's what happened on 2026-09-22 (EmissionsSQL, ref zzoervdobfuvnldqaicn)
# and broke sign-in until it was manually restored. This just pings the
# project's REST endpoint on a schedule so it never goes quiet that long.

on:
  schedule:
    # Day-of-month */5 -> fires on the 1st, 6th, 11th, 16th, 21st, 26th and
    # 31st of every month. Cron has no native "every N days" step that spans
    # month boundaries evenly, so this is the closest fit — the gap between
    # runs is never more than 5 days and sometimes a little less (e.g. 31st
    # -> 1st), never more, which is all that matters against a 7-day pause
    # threshold.
    - cron: '0 6 */5 * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the EmissionsSQL Supabase project
        run: |
          # This is the publishable/anon key — the same one already shipped
          # in the built frontend bundle to every visitor's browser. It is
          # not a secret and RLS is what actually protects the data, so it's
          # safe to commit here rather than wire up a repo secret for it.
          curl -sf "https://zzoervdobfuvnldqaicn.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_iyXjS6NLoq7NO0DpNMOoBA_3ajcmkpH" \
            -o /dev/null -w "Supabase ping: HTTP %{http_code}\n"
